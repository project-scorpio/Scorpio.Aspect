version: 0.1.0.{build}
image: Visual Studio 2022
configuration: Release
pull_requests:
  do_not_increment_build_number: true

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

build_script:
  - ps: .\build.ps1

test: off

artifacts:
  - path: artifacts\**\*.nupkg
  - path: artifacts\**\*.snupkg
